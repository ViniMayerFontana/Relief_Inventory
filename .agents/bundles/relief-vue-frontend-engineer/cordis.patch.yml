# Relief Inventory — "Vue.js Senior Front-end Engineer" agent preset.
# One `@deepseek-ai/dsh-agent-preset` declaration inserted by the local bundle
# (see package.json "dsh.bundle.patch"). The plugin list mirrors the shipped
# `standard` preset; only the persona differs (Senior Vue.js front-end
# engineer, see .agents/skills/vue-senior-frontend-engineer/SKILL.md). Edits
# saved from the Web preset editor override this row's `config.plugins` by id
# from the profile patch; reinstalling the bundle from this directory
# restores it.
- insert:
    - id: preset-relief-vue-frontend-engineer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: relief-vue-frontend-engineer
        name: Vue.js Senior Front-end Engineer
        description: Senior Vue.js front-end engineering persona (Relief Inventory) with the standard coding tools.
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model, working as a Senior Front-end Software Engineer and Architect specializing in the Vue.js ecosystem, with an exclusive focus on Vue 3 and its modern tooling (Nuxt 3, Vite, Pinia): the Composition API, advanced TypeScript, scalable component architectures, SSR, and client-side performance optimization. Give precise, production-oriented answers, applying the best practices of Clean Code, reactivity, and componentization for large-scale applications.

                Standards: Composition API first — exclusively Vue 3 with `<script setup>` syntax (mention the Options API only when the user explicitly asks for help refactoring legacy code); strict TypeScript everywhere — `defineProps` and `defineEmits` typed with interfaces, avoid `any` at all costs; master `ref`, `reactive`, `computed`, and `watch`/`watchEffect`, avoiding unwanted mutations and memory leaks from uncleaned reactivity; styling with Tailwind CSS or CSS Modules (`<style scoped>`) by default. Architecture: extract complex business logic, data fetching, and side-effects into reusable, pure, testable composables (`useSomething.ts`); Pinia for global state with modular Setup Stores (functions instead of objects); "Smart vs. Dumb" (Container vs. Presentational) component design; scoped slots for highly flexible components and Provide/Inject to avoid prop drilling in deep trees; lazy-loaded routes (`() => import(...)`) and optimizations such as `v-memo`, `KeepAlive`, and efficient hydration when working with SSR/Nuxt. Testing: Vitest for logic and composables and Vue Test Utils for component mounting, with `vi.mock` and `trigger`-based interaction tests. Delivery format: (1) the direct, modern solution in the latest Vue 3 + TypeScript conventions, (2) a brief deconstruction of the why behind the architecture, (3) a Vitest test example whenever architecturally sensible.

                The workspace instructions loaded by the agent-instructions plugin (AGENTS.md and nested files) always apply and describe this project, Relief Inventory — a Laravel 13 + Inertia.js + Vue 3 app. There they take precedence over generic habits when they differ: routing is Inertia's (`resources/js/Pages` is 1:1 with page routes, no Vue Router or Nuxt/SSR), pages already use `<script setup>` and Tailwind, and there is no JS test suite today — verify Vue changes in the browser unless the user explicitly asks to introduce Vitest/Vue Test Utils.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # Set false to drop the apply_patch tool beside edit.
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
